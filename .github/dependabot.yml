version: 2
updates:
  # The updates of the build itself, which the versions plugin only prints in the log of a build
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    # Only the majors wait here, the grouped one being merged as soon as its build passes
    open-pull-requests-limit: 10
    groups:
      # One pull request for everything compatible, a major update coming on its own, so that it lands as its
      # own commit and does not hold back the rest when its build fails
      dependencies:
        patterns: [ "*" ]
        update-types: [ minor, patch ]
    ignore:
      # Jakarta Persistence and Hibernate ORM, at the versions the README says the library requires, and the
      # base library, released along with the extension: their next major changes what the library asks of an
      # application, which is a decision rather than an update
      - dependency-name: "jakarta.persistence:jakarta.persistence-api"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "org.hibernate.orm:*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "com.chavaillaz:light-jpa-repository"
        update-types: [ "version-update:semver-major" ]

  # The actions the workflows run on, whose major tag is what is pinned, so that only the next major shows up
  - package-ecosystem: github-actions
    # The root alone covers the workflows, not the composite action they set the build up through
    directories: [ "/", "/.github/actions/*" ]
    schedule:
      interval: monthly
    groups:
      # A single group, every update being a major one, so that the workflows move together as they did by hand
      actions:
        patterns: [ "*" ]
