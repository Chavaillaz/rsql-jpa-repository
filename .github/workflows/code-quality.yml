name: Code quality
on:
  push:
    branches:
      - master
  pull_request:
    types: [ opened, synchronize, reopened ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded run is dropped everywhere but on master, whose every push keeps its own status and badge
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whole history, the analysis dating each line by the commit that wrote it to tell new code apart
          fetch-depth: 0

      - name: Set up
        uses: ./.github/actions/setup

      - name: Build
        run: mvn -B -Pcoverage verify

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
