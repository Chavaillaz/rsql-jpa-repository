name: Dependency check
on: push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded run is dropped everywhere but on master, whose every push keeps its own status and badge
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
permissions:
  contents: read
  # What the upload of the report to the code scanning of the repository writes
  security-events: write
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Snyk to monitor for vulnerabilities
        uses: snyk/actions/maven@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/maven@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif --include-provided-dependencies=false

      - name: Upload result to GitHub Code Scanning
        # The scan above is allowed to fail, in which case it wrote no report for this step to upload
        if: hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
