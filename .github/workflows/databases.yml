name: Databases
on:
  push:
    branches:
      - master
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded run is dropped everywhere but on master, whose every push keeps its own status and badge
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  test:
    name: ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [ postgresql, sqlserver, oracle ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup

      - name: Test on ${{ matrix.database }}
        run: mvn -B verify -Ddatabase=${{ matrix.database }}
